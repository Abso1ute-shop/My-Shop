.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.charts .chart:first-child{grid-column:1/-1}}
.kpi{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}.kpi b{font-size:clamp(16px,4.6vw,21px);letter-spacing:-.3px;line-height:1.2;word-break:break-word}@media(min-width:900px){.kpi b{font-size:21px}nav{justify-content:center}}.kpi span{font-size:13px;color:var(--fg);opacity:.85}.kpi small{font-size:11px;color:var(--mu)}

.cw{position:relative;height:170px}.cw svg{position:absolute;inset:0;width:100%;height:100%}.xl{position:absolute;left:0;right:0;bottom:0;height:20px;pointer-events:none}.xl span{position:absolute;bottom:2px;transform:translateX(-50%);font-size:11px;color:var(--mu)}

.topr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}.topr:first-of-type{margin-top:8px}.tn{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.st.f{background:#fff;color:#000}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const API="https://abso1ute-shop.amirluckyyy.workers.dev";
const $=s=>document.querySelector(s),$$=(s,c)=>[...(c||document).querySelectorAll(s)];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" сум";
const CATN={top:"Верх",bottom:"Низ",shoes:"Обувь",acc:"Аксессуары",tech:"Техника"};
const STS=["Ожидает оплаты","Оплачен","Взвешивается","Ожидает оплаты карго","В пути","На складе","В пункте выдачи","Завершён","Отменён"],STC={"На складе":"s","В пункте выдачи":"d","Завершён":"f","Ожидает оплаты":"n","Оплачен":"p","Взвешивается":"s","Ожидает оплаты карго":"n","В пути":"s","Доставлен":"d","Отменён":"c","Новый":"n","Подтверждён":"p","Отправлен":"s"};
const RATE={auto:100000,avia:150000};
function cargoForm(o){
 const cg=o.cargo,can=["Оплачен","Взвешивается","Ожидает оплаты карго"].includes(o.st)&&!(cg&&cg.paid)&&o.ship!=="fast";
 const id=esc(o.id),ty=cg?cg.type:(o.ship==="avia"?"avia":"auto"),lines=o.lines||[];
 const shipTxt=o.ship==="avia"?"Авиа (5–7 дней)":o.ship==="fast"?"1 день · карго 0 сум":o.ship==="auto"?"Авто (13–15 дней)":"";
 const info=(shipTxt?`<div class="mu" style="margin:6px 0">Доставка: <b style="color:var(--fg)">${shipTxt}</b></div>`:"")+(cg?`<div class="mu" style="margin:8px 0;line-height:1.5">Карго: ${cg.kg} кг · ${cg.type==="avia"?"Авиа":"Авто"} · <b style="color:var(--fg)">${fmt(cg.sum)}</b> — ${cg.paid?"оплачено":cg.pending?"чек на проверке":cg.no?'<span style="color:#ff6b6b">❌ чек отклонён — покупатель видит «Оплата карго не прошла» и может оплатить заново</span>':"ждёт оплаты покупателем"}${(cg.items||[]).length?"<br>"+cg.items.map(x=>esc(x.name)+(x.col?" ("+esc(x.col)+")":"")+": "+x.kg+" кг · "+fmt(x.sum)).join("<br>"):""}</div>`:"");
 if(!can)return info;
 if(!lines.length)return info+`<div class="card" style="background:#101010;margin:10px 0 0"><span class="lb">Карго: вес в кг и способ доставки</span><div class="bar"><input data-kg="${id}" type="number" step="0.01" inputmode="decimal" placeholder="Вес, кг" value="${cg?cg.kg:""}"><select data-ty="${id}" style="margin:0;width:110px"><option value="auto" ${ty==="avia"?"":"selected"}>Авто</option><option value="avia" ${ty==="avia"?"selected":""}>Авиа</option></select></div><span class="lb">Сумма карго, сум</span><input data-cs="${id}" type="number" inputmode="numeric" placeholder="0" value="${cg?cg.sum:""}"><button class="b" data-cgs="${id}">Отправить покупателю</button></div>`;
 const old=(cg&&cg.items)||[];
 return info+`<div class="card" style="background:#101010;margin:10px 0 0"><div class="r"><span class="lb" style="margin:0">Карго по каждому товару</span><select data-ty="${id}" style="margin:0;width:110px"><option value="auto" ${ty==="avia"?"":"selected"}>Авто</option><option value="avia" ${ty==="avia"?"selected":""}>Авиа</option></select></div>${lines.map((l,k)=>`<div style="border-top:1px solid var(--ln);padding:10px 0 4px;margin-top:8px"><div style="font-size:14px;margin-bottom:6px">${esc(l.name)}${l.col?" · "+esc(l.col):""}${l.sz?" · "+esc(l.sz):""} × ${l.q}${l.fast?' <span class="mu">(1 день — карго 0)</span>':""}</div><div class="bar" style="margin:0"><input data-ckg="${id}" data-k="${k}" type="number" step="0.01" inputmode="decimal" placeholder="Вес, кг" value="${old[k]?old[k].kg:(l.fast?0:"")}"><input data-csm="${id}" data-k="${k}" type="number" inputmode="numeric" placeholder="Сумма, сум" value="${old[k]?old[k].sum:(l.fast?0:"")}"></div></div>`).join("")}<div class="r" style="margin:10px 0"><span class="mu">Итого</span><b data-ctot="${id}">${cg?cg.kg+" кг · "+fmt(cg.sum):"—"}</b></div><button class="b" data-cgs="${id}">Отправить покупателю</button></div>`;
}
const CLS="XS S M L XL 2XL 3XL 4XL 5XL".split(" "),SHS="36 37 38 39 40 41 42 43 44".split(" "),defSz=c=>c==="shoes"?SHS:c==="acc"||c==="tech"?["Стандарт"]:CLS;
let tok=localStorage.getItem("adm")||"",tab="dash",ST=null,dper="week",P=[],O=[],U=[],PR=[],R=[],ofl="all",rfl="all",ufl="all",pcf="all",q="";
let tm;const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("on"),2600)};

async function call(path,body){
 try{const r=await fetch(API+path,{method:body===undefined?"GET":"POST",cache:"no-store",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);if(r.status===401){tok="";localStorage.removeItem("adm");login()}return j}catch(e){return null}
}
function login(){
 $("#app").innerHTML=`<div class="lg"><h1>ABSO1UTE</h1><p>Админ-панель</p><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button class="b" id="go">Войти</button><p class="le" id="le"></p></div>`;
 const go=async()=>{
  const le=$("#le"),btn=$("#go");le.style.color="";le.textContent="";
  if(!$("#pw").value)return le.textContent="Введите пароль";
  btn.disabled=true;btn.textContent="Проверяю…";
  let resp,r=null;
  try{resp=await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass:$("#pw").value})});r=await resp.json().catch(()=>null)}
  catch(e){btn.disabled=false;btn.textContent="Войти";return le.textContent="Нет связи с сервером. Проверьте интернет. Если интернет есть, проверьте, что новый worker.js загружен в absolute-api."}
  btn.disabled=false;btn.textContent="Войти";
  if(!r)return le.textContent="Сервер ответил ошибкой "+resp.status+". Проверьте, что новый worker.js загружен и сборка в Cloudflare прошла.";
  if(!r.ok){if(/Нужно войти/.test(r.err||""))return le.textContent="Сервер ещё не обновлён: загрузите новый worker.js в репозиторий absolute-api и дождитесь зелёной галочки в Cloudflare.";return le.textContent=r.err||"Ошибка"}
  if(r.need2fa)return codeStep($("#pw").value,r.cid);
  tok=r.token;localStorage.setItem("adm",tok);start()};
 $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
function codeStep(pass,cid){
 $("#app").innerHTML=`<div class="lg"><h1>ABSO1UTE</h1><p>Код отправлен вам в Telegram</p><input id="cd" type="text" inputmode="numeric" maxlength="6" placeholder="Код из Telegram" autocomplete="one-time-code"><button class="b" id="go">Подтвердить</button><button class="g" id="bk" style="margin-top:10px;width:100%">Назад</button><p class="le" id="le"></p></div>`;
 $("#cd").focus();$("#bk").onclick=login;
 const go=async()=>{
  const le=$("#le"),btn=$("#go"),c=$("#cd").value.replace(/\D/g,"");le.textContent="";
  if(c.length!==6)return le.textContent="Введите 6 цифр из Telegram";
  btn.disabled=true;btn.textContent="Проверяю…";let r=null;
  try{r=await (await fetch(API+"/admin/login/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass,cid,code:c})})).json()}catch(e){}
  btn.disabled=false;btn.textContent="Подтвердить";
  if(!r)return le.textContent="Нет связи с сервером";
  if(!r.ok){if(/истёк|использован|Слишком/.test(r.err||""))setTimeout(login,1800);return le.textContent=r.err||"Ошибка"}
  pass="";tok=r.token;localStorage.setItem("adm",tok);start()};
 $("#go").onclick=go;$("#cd").oninput=e=>{if(e.target.value.replace(/\D/g,"").length===6)go()};$("#cd").onkeydown=e=>{if(e.key==="Enter")go()};
}

function barChart(rows,key,label,money){
 const W=600,H=170,pl=6,pr=6,pt=18,pb=24,n=rows.length,bw=(W-pl-pr)/n,max=Math.max(1,...rows.map(r=>r[key])),y=v=>pt+(H-pt-pb)*(1-v/max);
 const nice=money?(max>=1e6?(max/1e6).toFixed(1).replace(".0","")+" млн":nfmt(max)):nfmt(max);
 const bars=rows.map((r,i)=>{const v=r[key],x=pl+i*bw+1,w=Math.max(2,bw-2),top=y(v),h=H-pb-top;const d=v>0?`M${x},${H-pb}V${top+Math.min(4,h)}Q${x},${top} ${x+Math.min(4,w/2)},${top}H${x+w-Math.min(4,w/2)}Q${x+w},${top} ${x+w},${top+Math.min(4,h)}V${H-pb}Z`:"";
  return`<g class="bg" data-i="${i}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>${d?`<path d="${d}" class="bar${i===n-1?" last":""}"/>`:`<rect x="${x}" y="${H-pb-1.5}" width="${w}" height="1.5" class="bar0"/>`}</g>`}).join("");
 const xl=rows.map((r,i)=>i%5===4||i===n-1?`<span style="left:${(pl+i*bw+bw/2)/W*100}%">${r.d.slice(8)}.${r.d.slice(5,7)}</span>`:"").join("");

}

/* ---------- ИИ: состояние очереди ---------- */
// Показывает, что делает ИИ: очередь, дневной лимит Cloudflare, последнюю ошибку; кнопки «Запустить сейчас» и «Проверить ИИ»
const AISTEP={c:"цвета",d:"описание",t:"перевод"};
const hm=ts=>new Date(ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function aiCard(st){
 if(!st||!st.ok)return`<b>🤖 ИИ</b><div class="mu" style="margin-top:4px">Не удалось узнать состояние${st&&st.err?": "+esc(st.err):""}</div>`;
 if(!st.ai)return`<b>🤖 ИИ</b><div style="margin-top:4px;color:#ff6b6b">❌ ИИ не подключён на сервере: в Cloudflare у воркера нет привязки AI. В wrangler.jsonc должно быть: "ai": { "binding": "AI" }</div>`;
 const g=st.gm||{},pct=Math.min(100,Math.round((st.use||0)/(st.free||10000)*100)),now=Date.now();
 const line=st.paused?`⏸ Лимиты ИИ на сегодня закончились — продолжит сам в <b>${hm(st.paused)}</b>`:st.total?`⏳ В очереди: <b>${st.total}</b> — ИИ работает (обычно 1–5 минут на товар)`:"✅ Очередь пуста — всё сделано";
 const q=(st.queue||[]).filter(j=>!j.old).slice(0,6),old=(st.queue||[]).filter(j=>j.old).length;
 const cron=st.cron?(now-st.cron<2.2*3600e3?`работает (${hm(st.cron)})`:`<span style="color:#e5a50a">давно не запускалось (${new Date(st.cron).toLocaleString("ru-RU")})</span>`):`<span class="mu">ещё не отметилось (появится в течение часа)</span>`;
 const gline=!g.key?`<div style="margin:2px 0 4px;color:#e5a50a">🧠 Gemini не подключён — сейчас работает только Cloudflare, его хватает примерно на 5–10 товаров в день</div>`
  :g.on?`<div style="margin:2px 0 4px">🧠 Gemini — <b style="color:#4cd964">подключён</b>${st.gq?` · сегодня запросов: ${st.gq}`:""}</div>${g.err?`<div class="mu" style="font-size:12px;margin-bottom:4px">${esc(g.err)}</div>`:""}`
  :`<div style="margin:2px 0 4px;color:#e5a50a">🧠 Gemini сейчас не отвечает${g.err?": "+esc(g.err):""}</div>`;
 const how=`<details class="hint" style="margin:6px 0 8px"${g.key?"":" open"}><summary>${g.key?"Как подключён Gemini":"Как убрать лимит (бесплатно, 3 минуты)"}</summary><p style="line-height:1.5">1. Откройте в Safari <b>aistudio.google.com</b> и войдите в свой Google-аккаунт.<br>2. Нажмите <b>Get API key</b> → <b>Create API key</b> и скопируйте ключ (начинается с AQ.… или AIza… — подходят оба). Никому его не отправляйте.<br>3. Откройте <b>dash.cloudflare.com</b> → Workers &amp; Pages → <b>abso1ute-shop</b> → Settings → Variables and Secrets → <b>Add</b>.<br>4. Type: <b>Secret</b>, Name: <b>GEMINI_KEY</b>, Value: вставьте ключ → <b>Deploy</b>.<br>5. Вернитесь сюда и нажмите «🧪 Проверить ИИ» — должно быть «✅ Gemini — работает».<br><span class="mu">Gemini от Google бесплатно делает сотни запросов в день — этого хватает на десятки товаров. Cloudflare остаётся запасным.</span></p></details>`;
 return`<div class="r"><b>🤖 ИИ: цвета, описания, перевод</b></div>
 <div style="margin:6px 0 4px;line-height:1.45">${line}</div>
 ${gline}
 <div class="mu" style="font-size:12px">☁️ Cloudflare${g.key?" (запасной)":""}: ~${(st.use||0).toLocaleString("ru-RU")} из ${(st.free||10000).toLocaleString("ru-RU")} нейронов сегодня${st.cfday?` — <span style="color:#e5a50a">на сегодня закончился (до ${hm(st.cfday)})</span>`:""}</div>
 <div style="height:6px;border-radius:3px;background:var(--ln);margin:6px 0 8px;overflow:hidden"><div style="height:100%;width:${st.cfday?100:pct}%;background:${st.cfday||pct>85?"#ff6b6b":pct>60?"#e5a50a":"#4cd964"}"></div></div>
 ${q.length?`<div style="font-size:13px;line-height:1.5;margin-bottom:6px">${q.map(j=>`• ${esc(j.name)} — ${j.steps.map(k=>AISTEP[k]).join(", ")||"отчёт"}${j.fail&&j.fail.length?` <span style="color:#e5a50a">(не вышло: ${j.fail.map(k=>AISTEP[k]).join(", ")})</span>`:""}`).join("<br>")}</div>`:""}
 ${old?`<div class="mu" style="font-size:12px;margin-bottom:6px">Старые товары на дозаполнении: ${old} (новые всегда первые)</div>`:""}
 ${st.err&&(st.total||st.paused)?`<div style="font-size:12px;line-height:1.45;margin-bottom:6px;color:#e5a50a">Последняя ошибка (${new Date(st.err.t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}): ${esc(st.err.m)}</div>`:""}
 ${how}
 <div class="mu" style="font-size:12px;margin-bottom:8px">Расписание (cron): ${cron}</div>
 <div class="bar" style="margin:0"><button class="b s" id="airun" style="padding:10px">▶️ Запустить сейчас</button><button class="b s" id="aitest" style="padding:10px">🧪 Проверить ИИ</button></div><div id="aitr" class="mu" style="font-size:12px;margin-top:6px"></div>`;
}
let aiPumpT=0,AIST=null;
async function aiStat(st){
 const box=$("#aist");if(!box)return;
 if(!st)st=await call("/admin/ai/status");
 if(st&&st.ok)AIST=st;
 if(!document.body.contains(box))return;
 box.innerHTML=aiCard(st);
 // подстраховка: если новый товар ждёт дольше 6 минут (расписание не успело), админка сама подтолкнёт ИИ
 if(st&&st.ok&&st.ai&&!st.paused&&(st.queue||[]).some(j=>!j.old&&j.ts&&Date.now()-j.ts>6*60e3)&&Date.now()-aiPumpT>70e3){aiPumpT=Date.now();
  setTimeout(async()=>{if(!$("#aist")||($("#airun")&&$("#airun").disabled))return;const r=await call("/admin/ai/run",{});if(r&&r.ok){if(r.run&&r.run.done)toast("🤖 ИИ доделал товары из очереди: "+r.run.done+" шаг(ов)");aiStat(r)}},1200)}
 const run=$("#airun"),test=$("#aitest");
 if(run)run.onclick=async()=>{run.disabled=true;test.disabled=true;run.textContent="⏳ ИИ работает… (до минуты)";
  const r=await call("/admin/ai/run",{});
  if(!r||!r.ok){run.disabled=false;test.disabled=false;run.textContent="▶️ Запустить сейчас";return toast(r&&r.err||"Нет связи")}
  const x=r.run||{};toast(x.paused?"Лимит ИИ на сегодня закончился — продолжит в "+hm(x.paused):x.done?"Готово шагов: "+x.done+(r.total?" · в очереди ещё "+r.total:""):r.total?"ИИ не смог сделать шаг — см. «Последняя ошибка»":"Очередь пуста — всё сделано");
  aiStat(r);if(x.done){const l=await call("/admin/products");if(l&&l.ok){P=l.items||P}}};
 if(test)test.onclick=async()=>{run.disabled=true;test.disabled=true;test.textContent="⏳ Проверяю…";
  const r=await call("/admin/ai/test",{});run.disabled=false;test.disabled=false;test.textContent="🧪 Проверить ИИ";
  const out=$("#aitr");if(!r||!r.ok){if(out)out.innerHTML=`<span style="color:#ff6b6b">${esc(r&&r.err||"Нет связи с сервером")}</span>`;return}
  if(out)out.innerHTML=r.tests.map(t=>t.ok?`✅ ${esc(t.k)} — работает (${(t.ms/1000).toFixed(1)} с)`:`${t.nokey?"⚪":"❌"} ${esc(t.k)}: ${esc(t.err)}`).join("<br>")+(r.paused?`<br>⏸ Лимиты ИИ на сегодня закончились — продолжит в ${hm(r.paused)}`:"");
  const s2=await call("/admin/ai/status");if(s2&&s2.ok){const keep=$("#aitr")&&$("#aitr").innerHTML;await aiStat(s2);if($("#aitr"))$("#aitr").innerHTML=keep}};
}

const thMissing=p=>(p.imgs||[]).filter(i=>!(p.th||[]).includes(i)),needTh=p=>thMissing(p).length>0;
const badName=n=>!n||/^(товар|аксес+уар[а-яё]*|акс+е+с*уар[а-яё]*|вещь|одежда|гаджет|техника|верх|низ)$/i.test(String(n).trim())||/новинка|продаж|успей|заказ|закаж|━|ищешь|отправ|скин|найд|пиши|напиш|подпис|канал|доставк|цен[аы]|сум\b|скидк|акци|наличи|директ|http|t\.me|бесплат|оплат|карго|спеши|осталось|магазин/i.test(n);
function trHash(n,d){let h=5381;const x=String(n||"")+"\u0001"+String(d||"");for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return (h>>>0).toString(36)}
const trLabels=p=>[...new Set([...(p.colors||[]),...(p.sizes||[]),...Object.values(p.imgColors||{})].map(x=>String(x||"").trim()).filter(x=>/[А-Яа-яЁё]/.test(x)))].slice(0,24);
const trKey=p=>{const l=trLabels(p);return l.length?trHash(p.name,String(p.desc||"")+"\u0002"+l.join("|")):trHash(p.name,p.desc||"")};
const needTr=p=>!p.tr||!p.tr.en||!p.tr.uz||p.tr.h!==trKey(p);

function shrink(f,cb){

  for(let i=0;i<4;i++){const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",qu);if(out.length<800000)break;k*=.8;qu-=.08}
  cb(out)};im.onerror=()=>cb(null);im.src=URL.createObjectURL(f);
}

 $$("[data-pa]").forEach(c=>c.onchange=async()=>{const x=PR.find(y=>y.code===c.dataset.pa);const r=await call("/admin/promo",{code:x.code,pct:x.pct,max:x.max,exp:x.exp?new Date(x.exp).toISOString().slice(0,10):"",active:c.checked});if(!r||!r.ok){c.checked=!c.checked;return toast(r&&r.err||"Нет связи")}x.active=c.checked;toast(c.checked?"Промокод включён":"Промокод выключен");dPromo()});
}
function promoP(code){
 const old=code?PR.find(x=>x.code===code):null,sh=document.createElement("div");sh.className="sheet";document.body.appendChild(sh);
 sh.innerHTML=`<div class="in"><div class="r"><h2>${old?"Промокод "+esc(code):"Новый промокод"}</h2><button class="g" id="cl">Закрыть</button></div>
 <span class="lb">Код (латиницей, например SALE10)</span><input id="pcd" value="${esc(code||"")}" ${old?"disabled":""} placeholder="SALE10" autocapitalize="characters" style="text-transform:uppercase">
 <span class="lb">Скидка, %</span><input id="ppc" type="number" inputmode="numeric" value="${old?old.pct:""}" placeholder="10">
 <span class="lb">Максимум использований (пусто — без ограничения)</span><input id="pmx" type="number" inputmode="numeric" value="${old&&old.max?old.max:""}" placeholder="100">
 <span class="lb">Действует до (пусто — без срока)</span><input id="pex" type="date" value="${old&&old.exp?new Date(old.exp).toISOString().slice(0,10):""}">
 <button class="b" id="sv" style="margin-top:10px">${old?"Сохранить":"Создать"}</button></div>`;
 $("#cl").onclick=()=>sh.remove();
 $("#sv").onclick=async()=>{const body={code:$("#pcd").value.trim(),pct:+$("#ppc").value,max:+$("#pmx").value||0,exp:$("#pex").value,active:old?old.active:true};
  if(!body.code)return toast("Введите код");if(!(body.pct>=1&&body.pct<=90))return toast("Скидка от 1 до 90%");
  const r=await call("/admin/promo",body);if(!r)return toast("Нет связи с сервером");if(!r.ok)return toast(r.err||"Ошибка");toast("Сохранено");sh.remove();show("promo")};
}

tok?start():login();
