<script>
const API="https://abso1ute-shop.amirluckyyy.workers.dev";

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" сум";
const CATN={top:"Верх",bottom:"Низ",shoes:"Обувь",acc:"Аксессуары",tech:"Техника"};
const STS=["Ожидает оплаты","Оплачен","Взвешивается","Ожидает оплаты карго","В пути","В пункте выдачи","Завершён","Отменён"],STC={"В пункте выдачи":"d","Завершён":"f","Ожидает оплаты":"n","Оплачен":"p","Взвешивается":"s","Ожидает оплаты карго":"n","В пути":"s","Доставлен":"d","Отменён":"c","Новый":"n","Подтверждён":"p","Отправлен":"s"};
const RATE={auto:100000,avia:150000};
function cargoForm(o){
 const cg=o.cargo,can=["Оплачен","Взвешивается","Ожидает оплаты карго"].includes(o.st)&&!(cg&&cg.paid)&&o.ship!=="fast";
 const id=esc(o.id),ty=cg?cg.type:(o.ship==="avia"?"avia":"auto"),lines=o.lines||[];
 const shipTxt=o.ship==="avia"?"Авиа (5–7 дней)":o.ship==="fast"?"1 день · карго 0 сум":o.ship==="auto"?"Авто (13–15 дней)":"";
 const info=(shipTxt?`<div class="mu" style="margin:6px 0">Доставка: <b style="color:var(--fg)">${shipTxt}</b></div>`:"")+(cg?`<div class="mu" style="margin:8px 0;line-height:1.5">Карго: ${cg.kg} кг · ${cg.type==="avia"?"Авиа":"Авто"} · <b style="color:var(--fg)">${fmt(cg.sum)}</b> — ${cg.paid?"оплачено":cg.pending?"чек на проверке":"ждёт оплаты покупателем"}${(cg.items||[]).length?"<br>"+cg.items.map(x=>esc(x.name)+(x.col?" ("+esc(x.col)+")":"")+": "+x.kg+" кг · "+fmt(x.sum)).join("<br>"):""}</div>`:"");
 if(!can)return info;
 if(!lines.length)return info+`<div class="card" style="background:#101010;margin:10px 0 0"><span class="lb">Карго: вес в кг и способ доставки</span><div class="bar"><input data-kg="${id}" type="number" step="0.01" inputmode="decimal" placeholder="Вес, кг" value="${cg?cg.kg:""}"><select data-ty="${id}" style="margin:0;width:110px"><option value="auto" ${ty==="avia"?"":"selected"}>Авто</option><option value="avia" ${ty==="avia"?"selected":""}>Авиа</option></select></div><span class="lb">Сумма карго, сум</span><input data-cs="${id}" type="number" inputmode="numeric" placeholder="0" value="${cg?cg.sum:""}"><button class="b" data-cgs="${id}">Отправить покупателю</button></div>`;
 const old=(cg&&cg.items)||[];
 return info+`<div class="card" style="background:#101010;margin:10px 0 0"><div class="r"><span class="lb" style="margin:0">Карго по каждому товару</span><select data-ty="${id}" style="margin:0;width:110px"><option value="auto" ${ty==="avia"?"":"selected"}>Авто</option><option value="avia" ${ty==="avia"?"selected":""}>Авиа</option></select></div>${lines.map((l,k)=>`<div style="border-top:1px solid var(--ln);padding:10px 0 4px;margin-top:8px"><div style="font-size:14px;margin-bottom:6px">${esc(l.name)}${l.col?" · "+esc(l.col):""}${l.sz?" · "+esc(l.sz):""} × ${l.q}${l.fast?' <span class="mu">(1 день — карго 0)</span>':""}</div><div class="bar" style="margin:0"><input data-ckg="${id}" data-k="${k}" type="number" step="0.01" inputmode="decimal" placeholder="Вес, кг" value="${old[k]?old[k].kg:(l.fast?0:"")}"><input data-csm="${id}" data-k="${k}" type="number" inputmode="numeric" placeholder="Сумма, сум" value="${old[k]?old[k].sum:(l.fast?0:"")}"></div></div>`).join("")}<div class="r" style="margin:10px 0"><span class="mu">Итого</span><b data-ctot="${id}">${cg?cg.kg+" кг · "+fmt(cg.sum):"—"}</b></div><button class="b" data-cgs="${id}">Отправить покупателю</button></div>`;
}
const CLS="XS S M L XL 2XL 3XL 4XL 5XL".split(" "),SHS="36 37 38 39 40 41 42 43 44".split(" "),defSz=c=>c==="shoes"?SHS:c==="acc"||c==="tech"?[]:CLS;
let tok=localStorage.getItem("adm")||"",tab="dash",ST=null,dper="week",P=[],O=[],U=[],PR=[],R=[],ofl="all",rfl="all",ufl="all",q="";
let tm;const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("on"),2600)};

async function call(path,body){
 try{const r=await fetch(API+path,{method:body===undefined?"GET":"POST",cache:"no-store",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);if(r.status===401){tok="";localStorage.removeItem("adm");login()}return j}catch(e){return null}
}
function login(){
 $("#app").innerHTML=`<div class="lg"><h1>ABSO1UTE</h1><p>Админ-панель</p><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button class="b" id="go">Войти</button><p class="le" id="le"></p></div>`;
 const go=async()=>{
  const le=$("#le"),btn=$("#go");le.style.color="";le.textContent="";
  if(!$("#pw").value)return le.textContent="Введите пароль";
  btn.disabled=true;btn.textContent="Проверяю…";
  let resp,r=null;
  try{resp=await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass:$("#pw").value})});r=await resp.json().catch(()=>null)}
  catch(e){btn.disabled=false;btn.textContent="Войти";return le.textContent="Нет связи с сервером. Проверьте интернет. Если интернет есть, проверьте, что новый worker.js загружен в absolute-api."}
  btn.disabled=false;btn.textContent="Войти";
  if(!r)return le.textContent="Сервер ответил ошибкой "+resp.status+". Проверьте, что новый worker.js загружен и сборка в Cloudflare прошла.";
  if(!r.ok){if(/Нужно войти/.test(r.err||""))return le.textContent="Сервер ещё не обновлён: загрузите новый worker.js в репозиторий absolute-api и дождитесь зелёной галочки в Cloudflare.";return le.textContent=r.err||"Ошибка"}
  if(r.need2fa)return codeStep($("#pw").value,r.cid);
  tok=r.token;localStorage.setItem("adm",tok);start()};
 $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
function codeStep(pass,cid){
 $("#app").innerHTML=`<div class="lg"><h1>ABSO1UTE</h1><p>Код отправлен вам в Telegram</p><input id="cd" type="text" inputmode="numeric" maxlength="6" placeholder="Код из Telegram" autocomplete="one-time-code"><button class="b" id="go">Подтвердить</button><button class="g" id="bk" style="margin-top:10px;width:100%">Назад</button><p class="le" id="le"></p></div>`;
 $("#cd").focus();$("#bk").onclick=login;
 const go=async()=>{
  const le=$("#le"),btn=$("#go"),c=$("#cd").value.replace(/\D/g,"");le.textContent="";
  if(c.length!==6)return le.textContent="Введите 6 цифр из Telegram";
  btn.disabled=true;btn.textContent="Проверяю…";let r=null;
  try{r=await (await fetch(API+"/admin/login/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass,cid,code:c})})).json()}catch(e){}
  btn.disabled=false;btn.textContent="Подтвердить";
  if(!r)return le.textContent="Нет связи с сервером";
  if(!r.ok){if(/истёк|использован|Слишком/.test(r.err||""))setTimeout(login,1800);return le.textContent=r.err||"Ошибка"}
  pass="";tok=r.token;localStorage.setItem("adm",tok);start()};
 $("#go").onclick=go;$("#cd").oninput=e=>{if(e.target.value.replace(/\D/g,"").length===6)go()};$("#cd").onkeydown=e=>{if(e.key==="Enter")go()};
}
function start(){
 $("#app").innerHTML=`<header><b>АДМИНКА</b><button class="g" id="out">Выйти</button></header><nav><button data-t="dash"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Сводка</span><i class="nb" data-nb="dash"></i></button><button data-t="ord"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg><span>Заказы</span><i class="nb" data-nb="ord"></i></button><button data-t="prod"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Товары</span><i class="nb" data-nb="prod"></i></button><button data-t="rev"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg><span>Отзывы</span><i class="nb" data-nb="rev"></i></button><button data-t="usr"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4 3.5-6 7.5-6s7.5 2 7.5 6"/></svg><span>Клиенты</span><i class="nb" data-nb="usr"></i></button><button data-t="promo"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 15l6-6"/></svg><span>Промокоды</span><i class="nb" data-nb="promo"></i></button></nav><main id="v"></main>`;
 $("#out").onclick=()=>{const t=tok;fetch(API+"/admin/logout",{method:"POST",headers:{Authorization:"Bearer "+t}}).catch(()=>{});tok="";localStorage.removeItem("adm");login()};
 $$("nav [data-t]").forEach(b=>b.onclick=()=>show(b.dataset.t));show(tab);setTimeout(pollOrd,1500);
}
async function show(t){
 tab=t;q="";$$("nav [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));

function shrink(f,cb){
 const im=new Image();im.onload=()=>{let k=Math.min(1,1000/Math.max(im.width,im.height)),qu=.82,out;
  for(let i=0;i<4;i++){const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",qu);if(out.length<800000)break;k*=.8;qu-=.08}
  cb(out)};im.src=URL.createObjectURL(f);
}
async function smallOf(url,mx=320){
 const bl=await (await fetch(url)).blob(),u=URL.createObjectURL(bl);
 try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("фото не загрузилось"));i.src=u});
  const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}finally{URL.revokeObjectURL(u)}
}

function openImport(){

 const step1=()=>{sh.innerHTML=`<div class="in">${head}<p class="mu" style="line-height:1.5;margin:6px 0 12px">Сервер прочитает открытую страницу канала, найдёт посты с товарами (хештег + цена), скачает все фото и сам определит цвета. Посты, которые уже есть на сайте, и одинаковые фото пропускаются.</p>

  $("#ix").onclick=close;$("#isc").onclick=scan};
 async function scan(){
  const want=Math.max(1,Math.min(300,+$("#icn").value||150)),ai=$("#iai").checked,btn=$("#isc");btn.disabled=true;found=[];

   if(found.length>=want||!r.next||!fresh.length||r.next<=1)break;before=r.next;
  }
  const dups=all.filter(x=>x.st==="dup").length,skips=all.filter(x=>x.st==="skip").length,ph=found.reduce((a,x)=>a+x.photos.length,0);
  sh.innerHTML=`<div class="in">${head}<div class="card"><b>Найдено новых товаров: ${found.length}</b><div class="mu" style="margin-top:6px;line-height:1.5">Фото: ${ph}<br>Уже есть на сайте: ${dups}<br>Не товар (нет хештега, цены или фото): ${skips}<br>Просмотрено постов: ${all.length}</div></div>
  ${ph+found.length>900?`<div class="card" style="border-color:#7a5c00"><b>Внимание</b><div class="mu" style="margin-top:4px;line-height:1.5">Бесплатный лимит Cloudflare — около 1000 записей в базу в день, а этот импорт займёт ~${ph+found.length}. Если лимит закончится, импорт остановится — нажмите ещё раз завтра, уже добавленные товары повторно не создадутся.</div></div>`:""}
  ${found.length?`<button class="b" id="igo">Добавить ${found.length} товаров</button>`:'<div class="empty">Новых товаров нет</div>'}
  <div class="thr" style="flex-direction:column;gap:6px;margin-top:12px">${found.map(x=>`<div class="it" id="ir${x.id}"><img src="${x.photos[0]}" alt="" referrerpolicy="no-referrer"><div class="m"><b>${esc(x.name)}</b><span class="mu" style="display:block">${fmt(x.price)} · фото: ${x.photos.length} · пост ${x.id}</span><span class="mu ist" style="display:block;color:var(--fg)">ждёт</span></div></div>`).join("")}</div></div>`;

 }

function dUsr(){
 const l=U.filter(u=>(ufl==="all"||(ufl==="ban"?u.ban:u.frz))&&(!q||(u.nick+" "+u.n+" "+u.t+" "+u.tgu).toLowerCase().includes(q)));
 $("#v").innerHTML=`<div class="bar"><input id="sq" placeholder="Поиск: ник, имя, телефон" value="${esc(q)}"></div><div class="chips">${[["all","Все ("+U.length+")"],["ban","Заблокированные ("+U.filter(u=>u.ban).length+")"],["frz","Заморожен баланс ("+U.filter(u=>u.frz).length+")"]].map(c=>`<button data-uf="${c[0]}" class="${ufl===c[0]?"on":""}">${c[1]}</button>`).join("")}</div>${l.length?l.map(u=>`<div class="card"><div class="r"><b>@${esc(u.nick)}</b><span class="bal">${fmt(u.bal)}</span></div><div class="mu" style="margin:4px 0 10px">${esc(u.n)||"без имени"}${u.t?" · "+esc(u.t):""}<br>Заказов: ${u.orders}${u.tg?" · Telegram"+(u.tgu?" @"+esc(u.tgu):""):""}${u.ts?" · с "+new Date(u.ts).toLocaleDateString("ru-RU"):""}</div>${u.ban||u.frz?`<div class="ubd">${u.ban?`<span class="ub ban">⛔ Заблокирован${u.ban!=="без причины"?": "+esc(u.ban):""}</span>`:""}${u.frz?'<span class="ub frz">❄️ Баланс заморожен</span>':""}</div>`:""}<button class="b s" data-bl="${esc(u.nick)}">Управлять</button></div>`).join(""):'<div class="empty">Никого нет</div>'}`;
 $("#sq").oninput=e=>{q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;dUsr();const s=$("#sq");s.focus();s.setSelectionRange(pos,pos)};
 $$("[data-uf]").forEach(b=>b.onclick=()=>{ufl=b.dataset.uf;dUsr()});
 $$("[data-bl]").forEach(b=>b.onclick=()=>balP(b.dataset.bl));
}
function balP(nick){
 const u=U.find(x=>x.nick===nick),sh=document.createElement("div");sh.className="sheet";document.body.appendChild(sh);
 sh.innerHTML=`<div class="in"><div class="r"><h2>@${esc(nick)}</h2><button class="g" id="cl">Закрыть</button></div><div class="mu">Текущий баланс</div><div class="bal" style="margin-bottom:16px">${fmt(u.bal)}</div><span class="lb">Сумма, сум</span><input id="am" type="number" inputmode="numeric" placeholder="50000"><div class="bar"><button class="b" id="pl">Пополнить</button><button class="b r" id="mi">Списать</button></div><p class="mu">Клиент получит сообщение об изменении баланса в чате на сайте.</p>
 <div class="uz"><span class="lb">Причина (необязательно, клиент увидит её в Telegram)</span><input id="rs" placeholder="Например: подозрение на мошенничество">
 <div class="ur"><div><b>❄️ Заморозить баланс</b><small>Клиент не сможет платить с баланса и пополнять его. Деньги останутся на счёте.</small></div><button class="b s${u.frz?"":" r"}" id="fz">${u.frz?"Разморозить":"Заморозить"}</button></div>
 <div class="ur"><div><b>⛔ Заблокировать аккаунт</b><small>Клиента выкинет с сайта, войти и зарегистрироваться на этот Telegram он не сможет.</small></div><button class="b s${u.ban?"":" r"}" id="bn">${u.ban?"Разблокировать":"Заблокировать"}</button></div>
 <div class="ur"><div><b>🗑 Удалить аккаунт</b><small>Удаляется насовсем вместе с балансом (${fmt(u.bal)}). Его заказы останутся в «Заказах». Ник и Telegram освободятся.</small></div><button class="b s r" id="dl">Удалить</button></div></div></div>`;
 $("#cl").onclick=()=>sh.remove();
 const go=async sg=>{const a=Math.round(+$("#am").value);if(!(a>0))return toast("Введите сумму");if(!confirm((sg>0?"Пополнить":"Списать")+" "+fmt(a)+" — @"+nick+"?"))return;
  const r=await call("/admin/balance",{nick,delta:sg*a});if(!r||!r.ok)return toast(r&&r.err||"Нет связи");toast("Баланс: "+fmt(r.bal));sh.remove();show("usr")};
 $("#pl").onclick=()=>go(1);$("#mi").onclick=()=>go(-1);
 const act=async(path,on,ok,extra={})=>{const r=await call(path,{nick,on,reason:$("#rs").value.trim(),...extra});if(!r||!r.ok)return toast(r&&r.err||"Нет связи");toast(ok);sh.remove();show("usr")};
 $("#fz").onclick=()=>{const on=!u.frz;if(confirm((on?"Заморозить":"Разморозить")+" баланс @"+nick+"?"))act("/admin/user/freeze",on,on?"Баланс заморожен":"Баланс разморожен")};
 $("#bn").onclick=()=>{const on=!u.ban;if(confirm((on?"Заблокировать":"Разблокировать")+" аккаунт @"+nick+"?"))act("/admin/user/ban",on,on?"Аккаунт заблокирован":"Аккаунт разблокирован")};
 $("#dl").onclick=()=>{const c=prompt("Удаление нельзя отменить. Баланс "+fmt(u.bal)+" пропадёт.\nЧтобы подтвердить, введите ник: "+nick);if(c===null)return;if(c.trim().replace(/^@/,"").toLowerCase()!==nick)return toast("Ник введён неверно — аккаунт не удалён");act("/admin/user/delete",true,"Аккаунт удалён",{confirm:nick})};
}

function dPromo(){
 $("#v").innerHTML=`<div class="bar"><button class="b" id="addp">+ Создать промокод</button></div>${PR.length?PR.map(x=>`<div class="card"><div class="r"><b style="font-size:18px;letter-spacing:1px">${esc(x.code)}</b><span class="st ${x.active?"d":"c"}">−${x.pct}%</span></div><div class="mu" style="margin:6px 0 12px">Использовано: ${x.uses||0}${x.max?" из "+x.max:""}${x.exp?" · до "+new Date(x.exp).toLocaleDateString("ru-RU"):" · без срока"}</div><div class="r"><div class="r" style="gap:10px"><span>Действует</span><label class="sw"><input type="checkbox" data-pa="${esc(x.code)}" ${x.active?"checked":""}><i></i></label></div><div><button class="g" data-pe="${esc(x.code)}">Редактировать</button>&nbsp;&nbsp;<button class="g" style="color:var(--no)" data-pd="${esc(x.code)}">Удалить</button></div></div></div>`).join(""):'<div class="empty">Промокодов пока нет</div>'}`;
 $("#addp").onclick=()=>promoP();
 $$("[data-pe]").forEach(b=>b.onclick=()=>promoP(b.dataset.pe));
 $$("[data-pd]").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить промокод "+b.dataset.pd+"?"))return;const r=await call("/admin/promo/delete",{code:b.dataset.pd});if(!r||!r.ok)return toast(r&&r.err||"Нет связи");toast("Удалено");show("promo")});
 $$("[data-pa]").forEach(c=>c.onchange=async()=>{const x=PR.find(y=>y.code===c.dataset.pa);const r=await call("/admin/promo",{code:x.code,pct:x.pct,max:x.max,exp:x.exp?new Date(x.exp).toISOString().slice(0,10):"",active:c.checked});if(!r||!r.ok){c.checked=!c.checked;return toast(r&&r.err||"Нет связи")}x.active=c.checked;toast(c.checked?"Промокод включён":"Промокод выключен");dPromo()});
}
function promoP(code){
 const old=code?PR.find(x=>x.code===code):null,sh=document.createElement("div");sh.className="sheet";document.body.appendChild(sh);
 sh.innerHTML=`<div class="in"><div class="r"><h2>${old?"Промокод "+esc(code):"Новый промокод"}</h2><button class="g" id="cl">Закрыть</button></div>
 <span class="lb">Код (латиницей, например SALE10)</span><input id="pcd" value="${esc(code||"")}" ${old?"disabled":""} placeholder="SALE10" autocapitalize="characters" style="text-transform:uppercase">
 <span class="lb">Скидка, %</span><input id="ppc" type="number" inputmode="numeric" value="${old?old.pct:""}" placeholder="10">
 <span class="lb">Максимум использований (пусто — без ограничения)</span><input id="pmx" type="number" inputmode="numeric" value="${old&&old.max?old.max:""}" placeholder="100">
 <span class="lb">Действует до (пусто — без срока)</span><input id="pex" type="date" value="${old&&old.exp?new Date(old.exp).toISOString().slice(0,10):""}">
 <button class="b" id="sv" style="margin-top:10px">${old?"Сохранить":"Создать"}</button></div>`;
 $("#cl").onclick=()=>sh.remove();
 $("#sv").onclick=async()=>{const body={code:$("#pcd").value.trim(),pct:+$("#ppc").value,max:+$("#pmx").value||0,exp:$("#pex").value,active:old?old.active:true};
  if(!body.code)return toast("Введите код");if(!(body.pct>=1&&body.pct<=90))return toast("Скидка от 1 до 90%");
  const r=await call("/admin/promo",body);if(!r)return toast("Нет связи с сервером");if(!r.ok)return toast(r.err||"Ошибка");toast("Сохранено");sh.remove();show("promo")};
}

tok?start():login();
</script>
</body>
</html>
